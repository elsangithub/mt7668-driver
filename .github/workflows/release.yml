name: Release on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build .deb and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Debian Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: ${VERSION}"
          chmod +x build-deb.sh
          ./build-deb.sh "${VERSION}"

      - name: Extract Changelog for Release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 .github/scripts/extract-changelog.py "${VERSION}" > release_notes.md

      - name: Publish Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          TITLE_PREFIX="Release "
          if [[ "${GITHUB_REF_NAME}" == *"rc"* ]] || [[ "${GITHUB_REF_NAME}" == *"beta"* ]]; then
            PRERELEASE_FLAG="--prerelease"
            TITLE_PREFIX=""
          fi
          gh release create "${GITHUB_REF_NAME}" \
            mt7668-dkms_*_all.deb \
            --title "${TITLE_PREFIX}${GITHUB_REF_NAME}" \
            --notes-file release_notes.md \
            ${PRERELEASE_FLAG}
