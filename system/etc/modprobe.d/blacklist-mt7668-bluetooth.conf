# Prevent the kernel btmtksdio driver from claiming MT7668 SDIO Bluetooth function
# which causes kernel timeouts (-110) and destabilizes the shared SDIO bus on FiberHome HG680-FJ.
blacklist btmtksdio
install btmtksdio /bin/true
blacklist btmtk
install btmtk /bin/true

# Prevent in-tree mt76 SDIO driver from conflicting with out-of-tree mt7668
blacklist mt7663s
install mt7663s /bin/true
blacklist mt76_sdio
install mt76_sdio /bin/true
blacklist mt7663_usb_sdio_common
install mt7663_usb_sdio_common /bin/true
blacklist mt7615_common
install mt7615_common /bin/true
blacklist mt76_connac_lib
install mt76_connac_lib /bin/true
blacklist mt76
install mt76 /bin/true

# Prevent obsolete distro-provided MT7668 SDIO driver from conflicting with wlan_mt7668
blacklist wlan_mt76x8_sdio
install wlan_mt76x8_sdio /bin/true
