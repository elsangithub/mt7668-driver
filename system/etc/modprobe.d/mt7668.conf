# MediaTek MT7668 SDIO Wi-Fi Driver Configuration (v2.0.1 by Elsangithub)
# Options:
#   ap_mode=0 (Default): Client (STA) mode only (wlan0 only).
#   ap_mode=1 : Dedicated AP mode (spawns ap0 alongside wlan0 for router/hotspot).
#   ap_mode=2 : Dual AP mode.
#   ap_mode=3 : P2P + AP mode.
#
# To activate dedicated SoftAP / Hotspot interface (ap0), uncomment below:
# options wlan_mt7668 ap_mode=1
